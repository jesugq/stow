# server
set -sa terminal-features 'xterm*:extkeys'
set -s set-clipboard on
set -s extended-keys on
set -s extended-keys-format csi-u
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -gw mode-keys vi
set -gw pane-base-index 1
set -g allow-passthrough on
set -g focus-events on
set -g mouse on
set -g base-index 1
set -g status-position top
set -g renumber-windows on
set -g prefix C-Space
bind 'C-Space' send-prefix

# chrome support
bind-key -n 'C-PageDown' next-window
bind-key -n 'C-PageUp' previous-window
bind-key -n 'C-S-PageDown' run-shell -C 'move-window -a -t ":#{e|+:#{window_index},1}"'
bind-key -n 'C-S-PageUp' run-shell -C 'move-window -b -t ":#{e|-:#{window_index},1}"'
run 'for i in 1 2 3 4 5 6 7 8; do tmux bind-key -n "M-$i" select-window -t ":$i"; done'
bind-key -n M-9 select-window -t ":{end}"

# linux support
unbind 'C-Enter'

# plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @oasis_flavor mirage
run '~/.tmux/plugins/tpm/tpm'
set -g status 2
set -g status-format[1] '#[fill=terminal]'

