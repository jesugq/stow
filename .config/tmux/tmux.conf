# server
set -sa terminal-features 'xterm*:extkeys'
set -s set-clipboard on
set -s extended-keys on
set -s extended-keys-format csi-u
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -gw mode-keys vi
set -gw pane-base-index 1
set -g allow-passthrough on
set -g focus-events on
set -g mouse on
set -g base-index 1
set -g status-position bottom
set -g renumber-windows on
set -g prefix C-Space
bind 'C-Space' send-prefix

# linux support
unbind 'C-Enter'
bind-key -n 'C-PageDown' next-window
bind-key -n 'C-PageUp' previous-window
bind-key 'C-PageUp' swap-window -d -t -1
bind-key 'C-PageDown' swap-window -d -t +1

# macos support
unbind '['
unbind '{'
unbind '}'
bind-key -n 'M-[' previous-window
bind-key -n 'M-{' previous-window
bind-key -n 'M-}' next-window
bind-key 'M-{' swap-window -d -t -1
bind-key 'M-}' swap-window -d -t +1

# normals
unbind 'd'
bind ',' source-file ~/.config/tmux/tmux.conf
bind '<' run ~/.tmux/plugins/tpm/bin/install_plugins
bind 'q' detach-client
bind 'a' new-window -a -- "$HOME/.script/afk"

# specials
bind 'C-Space' \
    if-shell -F '#{==:#{@last_lead},session}' 'switch-client -l' \; \
    if-shell -F '#{==:#{@last_lead},window}' 'select-window -l' \; \
    if-shell -F '#{==:#{@last_lead},pane}' 'select-pane -l'

# sessions
bind 'o' switch-client -T session-table
bind -T session-table 'o' switch-client -l \; set-option -g @last_lead 'session'
bind -T session-table 'e' choose-tree -s
bind -T session-table 's' command-prompt "rename-session '%%'"
bind -T session-table 'c' command-prompt "new-session -A -s '%%'"
bind -T session-table 'z' if-shell -F '#{m/r:(sh|bash|zsh),#{pane_current_command}}' \
    kill-session \
    'confirm-before -p "kill-session #S? (y/n)" "kill-session"'

# windows (buffers)
unbind 'c'
bind 'b' switch-client -T window-table
bind -T window-table 'b' select-window -l \; set-option -g @last_lead 'window'
bind -T window-table 'e' run 'tmux choose-tree -wf "##{==:##{session_name},#{session_name}}"'
bind -T window-table 's' command-prompt "rename-window '%%'"
bind -T window-table 'c' new-window -a -c "#{pane_current_path}"
bind -T window-table 'v' new-window -b -c "#{pane_current_path}"
bind -T window-table 'z' if-shell -F '#{m/r:(sh|bash|zsh),#{pane_current_command}}' \
    kill-window \
    'confirm-before -p "kill-window #I:#W? (y/n)" "kill-window"'

# panes (windows)
unbind 'x'
bind 'w' switch-client -T pane-table
bind -T pane-table 'w' select-pane -l \; set-option -g @last_lead 'pane'
bind -T pane-table 'e' run 'tmux choose-tree -t "#{pane_id}" -f "##{||:##{==:##{pane_id},#{pane_id}},##{>:##{window_panes},1}}" ; tmux send-keys -t "#{pane_id}" H'
bind -T pane-table 'z' if-shell -F '#{m/r:(sh|bash|zsh),#{pane_current_command}}' \
    kill-pane \
    'confirm-before -p "kill-pane #P? (y/n)" "kill-pane"'
bind -T pane-table 'c' split-window -v
bind -T pane-table 'v' split-window -h
bind -T pane-table 'h' select-pane -L
bind -T pane-table 'j' select-pane -D
bind -T pane-table 'k' select-pane -U
bind -T pane-table 'l' select-pane -R
bind -T pane-table 'H' swap-pane -t '{left-of}'
bind -T pane-table 'J' swap-pane -t '{down-of}'
bind -T pane-table 'K' swap-pane -t '{up-of}'
bind -T pane-table 'L' swap-pane -t '{right-of}'

# copy
bind '/' if-shell -F '#{pane_in_mode}' 'send-keys -X cancel' 'copy-mode'
bind-key -T copy-mode-vi 'MouseDragEnd1Pane' send-keys -X copy-selection
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'V' send-keys -X select-line
bind-key -T copy-mode-vi 'C-v' send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection
bind-key -T copy-mode-vi 'Y' send-keys -X copy-line

# yazi
is_yazi="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?yazi$'"
bind-key -n 'M-[' if-shell "$is_yazi" 'send-keys M-[' next-window

# plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @oasis_flavor mirage
run '~/.tmux/plugins/tpm/tpm'

# finish
display-message "TMUX config reloaded."
