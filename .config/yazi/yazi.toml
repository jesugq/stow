[mgr]
show_hidden = true
linemode = "size"

[opener]
edit = [
  { run = "${EDITOR:-nvim} %s", desc = "$EDITOR", for = "unix", block = true },
]
open = [
  { run = "xdg-open %s1", desc = "Open", for = "linux", orphan = true },
  { run = "open %s", desc = "Open", for = "macos", orphan = true },
]
reveal = [
  { run = "xdg-open %d1", desc = "Reveal", for = "linux", orphan = true },
  { run = "open -R %s1", desc = "Reveal", for = "macos", orphan = true },
]
extract = [
  { run = "ya pub extract --list %s", desc = "Extract here" },
]
trash = [
  { run = "ya pub trash-restore --list %S", desc = "Restore selected files" },
  { run = "ya pub trash-empty --list %S",   desc = "Empty trash bin" },
]

[open]
rules = [
  { mime = "text/*", use = [ "reveal", "edit", "open" ] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "reveal", "extract", "open" ] },
  { mime = "trash/**", use = [ "reveal", "trash" ] },
  { mime = "folder/*", use = [ "reveal", "open" ] },
  { mime = "image/*", use = [ "reveal", "open" ] },
  { mime = "{audio,video}/*", use = [ "reveal", "open" ] },
  { url = "*", use = [ "reveal" ] },
]
